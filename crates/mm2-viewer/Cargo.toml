[package]
name = "mm2-viewer"
description = "Fly around a Motocross Madness 2 track"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
ab_glyph = "0.2.29"
gilrs = { version = "0.11", optional = true }
glam = "0.30"
mm2-formats = { version = "0.6.1", path = "../mm2-formats" }
mm2-course = { version = "0.6.1", path = "../mm2-course" }
mm2-indeo = { version = "0.6.1", path = "../mm2-indeo" }
mm2-physics = { version = "0.6.1", path = "../mm2-physics" }
mm2-settings = { version = "0.6.1", path = "../mm2-settings" }
png = "0.18.1"
# The built-in photo materials (assets/ground), lossless WebP.
image-webp = "0.2"
# The free pack's glTF models carry JPEG textures too.
zune-jpeg = "0.5"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30"
# Instant and SystemTime that also work in a browser.
web-time = "1"

# The browser build (tools/build-web.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Location", "Navigator", "console", "Request", "RequestInit", "Response", "AudioContext", "AudioContextState", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Sound on the desktop (a browser uses Web Audio, see audio.rs).
cpal = { version = "0.16.0", optional = true }
# The leaderboard server (online.rs); a browser uses fetch.
# The replay editor's clips: Motion JPEG movies (clip.rs).
jpeg-encoder = "0.6"
# The player's own intro video (own_video.rs): an MP4's H.264 picture
# (Cisco's OpenH264, built from source), its boxes and its AAC sound.
openh264 = "0.9"
mp4 = "0.14"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
ureq = "3"
# The Course Builder's pictures and models (pick.rs).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
# Network play with browsers (net/rtc.rs): WebRTC data channels, introduced
# by the PeerJS server the browser build uses.
bytes = "1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
webrtc = "0.13"
# Gyro steering (gyro.rs): SDL reads the motion sensors of the pads that
# have them (Steam Deck, Steam Controller, DualSense, DualShock 4, Switch
# Pro, Joy-Cons), which gilrs can't. Built in, only its pad parts.
sdl3-sys = { version = "0.7", optional = true, default-features = false, features = ["build-from-source-static", "no-default-subsystems", "sdl-joystick", "sdl-hidapi", "sdl-sensor", "sdl-unix-console-build"] }

[dev-dependencies]
# The shader test (src/shader_tests.rs): the compiler the GPU code uses.
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out", "msl-out", "hlsl-out"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["gamepad", "audio", "gyro"]
# Gamepad support. On Linux it needs libudev (libudev-dev).
gamepad = ["dep:gilrs"]
# Gyro steering, off until the Extras setting turns it on. It builds SDL
# from source (needs CMake and a C compiler); not in the browser.
gyro = ["gamepad", "dep:sdl3-sys"]
# Sound. On Linux it needs ALSA (libasound2-dev).
audio = ["dep:cpal"]

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"
