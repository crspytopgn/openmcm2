[package]
name = "mm2-viewer"
description = "Fly around a Motocross Madness 2 track"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = { version = "0.16.0", optional = true }
ab_glyph = "0.2.29"
gilrs = { version = "0.11", optional = true }
glam = "0.30"
mm2-formats = { version = "0.2.1", path = "../mm2-formats" }
mm2-indeo = { version = "0.2.1", path = "../mm2-indeo" }
mm2-physics = { version = "0.2.1", path = "../mm2-physics" }
png = "0.18.1"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["gamepad", "audio"]
# Gamepad support. On Linux it needs libudev (libudev-dev).
gamepad = ["dep:gilrs"]
# Sound. On Linux it needs ALSA (libasound2-dev).
audio = ["dep:cpal"]

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"
