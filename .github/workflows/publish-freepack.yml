# Publishes the Free Pack: the launcher's download (the "freepack" GitHub
# pre-release) and the browser's (the openmcm2-freepack R2 bucket).
#
# The finished pack folder (stockmap.toml at its root, shared textures
# split out) comes in as a zip on a DRAFT release tagged "freepack-source"
# (drafts aren't public), uploaded from the Mac with:
#   gh release create freepack-source --draft --repo crspytopgn/openmcm2 --title "Free Pack source" --notes "not public"   # once
#   gh release upload freepack-source pack.zip --clobber --repo crspytopgn/openmcm2
# or, where a release can't be uploaded to, as pack.zip split into parts
# (split -b 90M pack.zip pack.zip.part-) on a branch named in `branch`;
# delete that branch once the pack is published.
#
# Secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID.
name: Publish the Free Pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The pack's version, e.g. 2026.11.20"
        required: true
      source:
        description: "The pack zip's name on the freepack-source draft release"
        default: pack.zip
      branch:
        description: "Or: a branch holding the zip split into pack.zip.part-* files"
        default: ""
      leave_out:
        description: "Folders of the source to leave out of the pack, space separated (e.g. TERAFORM)"
        default: ""
      sounds:
        description: "Remake sound/ from the CC0 recordings (tools/freepack/make_sounds.py)"
        type: boolean
        default: false
      sound_from:
        description: "Or: a branch whose sound/ is laid over the pack's (each engine class it has replaced whole), e.g. freepack-audio"
        default: ""
      colour_lift:
        description: "How much more colour the scenery gets (tools/freepack/saturate.py): 0.20 = 20 %, 0 = as the source has it"
        default: "0.20"
      dry_run:
        description: "Only pack it and list what would change, upload nothing"
        type: boolean
        default: true
  workflow_call:
    inputs:
      version: { type: string, required: true }
      source: { type: string, default: pack.zip }
      branch: { type: string, default: "" }
      leave_out: { type: string, default: "" }
      sounds: { type: boolean, default: false }
      sound_from: { type: string, default: "" }
      colour_lift: { type: string, default: "0.20" }
      dry_run: { type: boolean, default: false }

permissions:
  contents: write

concurrency: publish-freepack

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BUCKET: openmcm2-freepack
    steps:
      - uses: actions/checkout@v4

      - name: Get the pack
        run: |
          if [ -n "${{ inputs.branch }}" ]; then
            git fetch --depth=1 origin "${{ inputs.branch }}"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP"
            cat "$RUNNER_TEMP"/pack.zip.part-* > pack.zip
            rm -f "$RUNNER_TEMP"/pack.zip.part-*
          else
            gh release download freepack-source --repo "$REPO" --pattern "${{ inputs.source }}" --output pack.zip
          fi
          mkdir src && cd src && unzip -q ../pack.zip
          # The folder holding stockmap.toml.
          root=$(dirname "$(find . -name stockmap.toml | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)")
          echo "PACK=$PWD/$root" >> "$GITHUB_ENV"

      - name: Pack it
        run: |
          for d in ${{ inputs.leave_out }}; do
            case "$d" in */*|..*|"") echo "leave_out takes top folder names only: $d"; exit 1;; esac
            rm -rf "$PACK/$d"
          done
          if [ "${{ inputs.sounds }}" = "true" ]; then
            sudo apt-get install -y -q python3-numpy
            rm -rf "$PACK/sound"
            python3 tools/freepack/make_sounds.py "$PACK" "$RUNNER_TEMP/sounds"
          fi
          # Recorded sounds kept on a branch of their own (the Freesound set).
          if [ -n "${{ inputs.sound_from }}" ]; then
            git fetch --depth=1 origin "${{ inputs.sound_from }}"
            mkdir "$RUNNER_TEMP/snd"
            git archive FETCH_HEAD sound | tar -x -C "$RUNNER_TEMP/snd"
            for c in "$RUNNER_TEMP"/snd/sound/engine/*/; do
              rm -rf "$PACK/sound/engine/$(basename "$c")"
            done
            mkdir -p "$PACK/sound"
            cp -R "$RUNNER_TEMP/snd/sound/." "$PACK/sound/"
          fi
          # The menus' Donate button opens Ko-fi (freepack/menu/make_ui.py
          # writes it so now; older sources still point at Sponsors).
          grep -rlIZ 'open_url:https://github.com/sponsors/crspytopgn' "$PACK" \
            | xargs -0 -r sed -i 's#open_url:https://github.com/sponsors/crspytopgn#open_url:https://ko-fi.com/crspytopgn#'
          # A little more colour in the scenery (ground, skies, plants, trackside
          # objects), before the previews below are drawn from the ground.
          sudo apt-get install -y -q python3-numpy python3-pil
          python3 tools/freepack/saturate.py "$PACK" "${{ inputs.colour_lift }}"
          # The free tracks' pictures, for the menus before a track is built.
          cargo build --release -q -p mm2-tools
          rm -rf "$PACK/previews"
          ./target/release/mm2-tools free-previews "$PACK/ground" "$PACK/previews" > /dev/null
          # The menus' own sounds, made in code, when the source lacks them.
          if [ ! -d "$PACK/sound/ui" ]; then
            sudo apt-get install -y -q python3-numpy
            python3 tools/freepack/make_ui_sounds.py "$PACK"
          fi
          # Every sound as Ogg Vorbis (from the WAV sources), a sixth the download.
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          python3 tools/freepack/ogg_sounds.py "$PACK"
          python3 tools/freepack/pack.py "$PACK" out "${{ inputs.version }}"

      - name: Set up rclone for R2
        run: |
          sudo apt-get install -y -q rclone
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: What changes
        run: |
          echo "R2 files new in this version:"
          rclone copy out/r2/files "r2:$BUCKET/files" --dry-run 2>&1 | grep -c "Skipped copy" || true
          echo "Release parts:"
          ls -la out/github

      - name: Upload to R2 (files first, the list last)
        if: ${{ !inputs.dry_run }}
        run: |
          rclone copy out/r2/files "r2:$BUCKET/files" --transfers 16 \
            --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copyto out/r2/freepack.json "r2:$BUCKET/freepack.json" \
            --header-upload "Cache-Control: no-cache" --header-upload "Content-Type: application/json"

      - name: Upload to the GitHub release (parts first, the list last)
        if: ${{ !inputs.dry_run }}
        run: |
          if ! gh release view freepack --repo "$REPO" >/dev/null 2>&1; then
            # A pre-release, so the launcher's own update check never takes it for a new OpenMCM2.
            gh release create freepack --repo "$REPO" --prerelease --title "Free Pack" \
              --notes "New art and sound to play OpenMCM2 without the original game's files. The launcher downloads this for you (Play page, Free graphics)."
          fi
          have=$(gh release view freepack --repo "$REPO" --json assets --jq '.assets[].name')
          for f in out/github/*.zip; do
            echo "$have" | grep -qx "$(basename "$f")" || gh release upload freepack "$f" --repo "$REPO"
          done
          # A part already on the release keeps its file as uploaded then, so the
          # list must carry that file's checksum, not the one of this run's
          # rebuilt zip (same files inside, other bytes).
          gh api "repos/$REPO/releases/tags/freepack" --jq '.assets[] | [.name, .digest] | @tsv' > digests.tsv
          python3 - out/github/freepack.json digests.tsv <<'PY'
          import json, sys
          path, tsv = sys.argv[1], sys.argv[2]
          have = {}
          for line in open(tsv):
              name, _, digest = line.rstrip("\n").partition("\t")
              if digest.startswith("sha256:"):
                  have[name] = digest[len("sha256:"):]
          m = json.load(open(path))
          for p in m["parts"]:
              if p["file"] not in have:
                  sys.exit(f"{p['file']} isn't on the release")
              if have[p["file"]] != p["sha256"]:
                  print(f"{p['file']}: using the uploaded file's checksum")
                  p["sha256"] = have[p["file"]]
          open(path, "w").write(json.dumps(m, indent=1))
          PY
          gh release upload freepack out/github/freepack.json --clobber --repo "$REPO"
          # Parts the new list no longer names.
          for old in $(echo "$have" | grep '^freepack-.*\.zip$'); do
            [ -e "out/github/$old" ] || gh release delete-asset freepack "$old" --repo "$REPO" --yes
          done
