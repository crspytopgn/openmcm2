name: CI

on:
  push:
    branches: [main]
    paths-ignore: [site/**]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Linux tests in the same AlmaLinux 8 container the release builds in.
      - if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD":/w -w /w almalinux:8 sh tools/linux-build.sh cargo test --release --workspace
      - if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
      - if: runner.os != 'Linux'
        run: cargo test --release --workspace
