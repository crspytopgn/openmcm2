[workspace]
resolver = "2"
members = ["crates/mm2-formats", "crates/mm2-indeo", "crates/mm2-physics", "crates/mm2-tools", "crates/mm2-viewer", "crates/mm2-launcher", "crates/mm2-settings"]

[workspace.package]
version = "0.5.5"
edition = "2021"
license = "MIT OR Apache-2.0"

# Smaller, quicker release builds: symbols stripped, and the whole program
# optimised as one at link time (about a third smaller than before, and
# a little faster). CI's test runs turn the link-time work off to stay
# quick (.github/workflows/ci.yml).
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
