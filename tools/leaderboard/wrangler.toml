name = "openmcm2-laps"
main = "worker.js"
compatibility_date = "2025-01-01"

# Make the namespace with `npx wrangler kv namespace create LAPS` and put
# the id it prints here.
[[kv_namespaces]]
binding = "LAPS"
id = "PUT-THE-NAMESPACE-ID-HERE"

# The server browser's open races (worker.js, Races): one Durable Object
# with its own SQLite table, which the free plan allows.
[[durable_objects.bindings]]
name = "RACES"
class_name = "Races"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Races"]

# The always-open free roam rooms (worker.js, Room): one Durable Object
# each, players on WebSockets.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]
